name: Build on Tag

on:
  push:
    tags:
      - 'v*'

jobs:
  validate-version:
    name: Validate release version
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Match tag to package version
        run: |
          PACKAGE_VERSION=$(python -c 'import tomllib; print(tomllib.load(open("backend/pyproject.toml", "rb"))["tool"]["poetry"]["version"])')
          test "$GITHUB_REF_NAME" = "v$PACKAGE_VERSION"

  macos:
    needs: validate-version
    strategy:
      matrix:
        os: [macos-15-intel, macos-latest]
    uses: ./.github/workflows/_build-macos.yaml
    with:
      os: ${{ matrix.os }}

  windows:
    needs: validate-version
    uses: ./.github/workflows/_build-windows.yaml

  linux:
    needs: validate-version
    uses: ./.github/workflows/_build-linux.yaml

  release:
    name: "Release"
    runs-on: ubuntu-latest
    needs:
      - validate-version
      - macos
      - windows
      - linux
    permissions:
      contents: write
    steps:
      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          path: release
          merge-multiple: true

      - name: Display structure of downloaded files
        run: ls -R release

      - name: Create GitHub Release
        id: create_release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            release/*
          generate_release_notes: true
